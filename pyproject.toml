[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powercalc-tools"
version = "0.1.0"
description = "Dependency-free calculators for Buck/Boost/Flyback/LDO design and microstrip patch antennas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "z3847200-sudo"}]
keywords = ["buck", "boost", "power-electronics", "antenna", "calculator"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.scripts]
powercalc = "powercalc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powercalc"]
